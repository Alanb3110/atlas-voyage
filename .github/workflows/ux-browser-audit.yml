name: UX Browser Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Run trip UX browser matrix
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/atlas-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/trip.html >/dev/null; then
              break
            fi
            sleep 1
          done
          npx playwright test tests/trip-ux.spec.mjs --browser=chromium --browser=webkit --reporter=line --workers=1
